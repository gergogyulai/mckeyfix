# Pushing a tag like v1.1.0 builds a universal MCKeyFix.app, publishes a GitHub release and updates the
# Homebrew cask. Tags with a suffix (v1.1.0-beta.1) become pre-releases and leave the cask alone.
# Running it by hand builds the zip as a workflow artifact without releasing anything.
#
# Secrets, optional:
#   TAP_TOKEN  a fine-grained token with Contents: read and write on gergogyulai/homebrew-tap.
#              Without it the cask isn't updated.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
      TAP_REPO: gergogyulai/homebrew-tap
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=MCKeyFix-$VERSION.zip" >> "$GITHUB_ENV"
          case "$VERSION" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
          swift --version

      - name: Build
        run: |
          UNIVERSAL=1 ./scripts/build-app.sh
          codesign --verify --strict --deep build/MCKeyFix.app
          ditto -c -k --keepParent build/MCKeyFix.app "$ZIP"
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          \`\`\`sh
          brew install gergogyulai/tap/mckeyfix
          \`\`\`

          Or download **$ZIP**, unzip it and move MCKeyFix.app to Applications. The app isn't notarized, so the
          first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway**.

          SHA-256: \`$SHA256\`
          NOTES
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$ZIP" $FLAGS \
            --title "MCKeyFix $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Update Homebrew cask
        if: github.ref_type == 'tag' && env.PRERELEASE == 'false' && env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          TAP="$RUNNER_TEMP/tap"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" "$TAP"
          mkdir -p "$TAP/Casks"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA256/" \
            -e '/^# Template for/d' -e '/^# The release workflow/d' \
            packaging/homebrew/mckeyfix.rb > "$TAP/Casks/mckeyfix.rb"
          cd "$TAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mckeyfix.rb
          git commit -m "mckeyfix $VERSION"
          git push
